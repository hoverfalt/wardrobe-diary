# Nightly data quality check (ROADMAP R-40 phase 3): runs the quality rules from the semantic layer
# (web/src/lib/quality.ts, the same code as the /data page) on the live public data. Reads only public data, so
# it needs no secrets. A failing error-severity rule fails the run, and GitHub emails the repository owner.
name: Data quality

on:
  schedule:
    - cron: "30 3 * * *" # 03:30 UTC, after the nightly backup
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: web
      - name: Check data quality
        run: node scripts/quality-check.mjs --json quality-report.json | tee -a "$GITHUB_STEP_SUMMARY"
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-report
          path: web/quality-report.json
