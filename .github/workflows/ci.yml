# Tests on every push: the app's metrics, the semantic layer's consistency with the code, the generated
# pages/JSON-LD/contracts being up to date and valid, the MCP server, and the Python tools.
name: Tests

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npx tsc -b
        working-directory: web
      - run: npm test
        working-directory: web

  mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: mcp
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npm run build && npm test
        working-directory: mcp

  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: pip install -r tools/requirements.txt
      - run: pytest -q
        working-directory: tools
